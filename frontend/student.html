<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Beta | الطالب</title>
<link rel="stylesheet" href="css/style.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <span class="brand">Beta</span>
      <div class="nav-item active">📁 موادي</div>
      <div class="nav-item" onclick="betaLogout()">🚪 تسجيل الخروج</div>
    </aside>

    <main class="main">
      <div class="topbar"><h2 id="welcomeText">مرحبًا 👋</h2></div>

      <div id="foldersView">
        <div class="folder-grid" id="folderGrid"></div>
      </div>

      <div id="filesView" style="display:none;">
        <button class="btn secondary" style="width:auto;margin-bottom:16px;" id="backBtn">⬅ رجوع للفولدرات</button>
        <div class="file-list" id="filesList"></div>
      </div>
    </main>
  </div>

  <!-- عارض PDF -->
  <div class="pdf-overlay" id="pdfOverlay" style="display:none;">
    <div class="pdf-toolbar">
      <div>
        <button id="prevPage">▶ السابق</button>
        <span id="pageInfo" style="color:#fff;margin:0 8px;"></span>
        <button id="nextPage">التالي ◀</button>
      </div>
      <div>
        <button id="zoomOut">－</button>
        <button id="zoomIn">＋</button>
        <button id="fullscreenBtn">⛶ ملء الشاشة</button>
        <button id="closeViewer">✕ إغلاق</button>
      </div>
    </div>
    <div class="pdf-canvas-wrap" id="pdfCanvasWrap" oncontextmenu="return false;">
      <canvas id="pdfCanvas"></canvas>
      <div class="watermark-layer" id="watermarkLayer"></div>
    </div>
  </div>

  <script type="module" src="js/student.js"></script>
</body>
</html>
