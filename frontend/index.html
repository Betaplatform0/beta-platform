<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Beta | تسجيل الدخول</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="brand" style="text-align:center;display:block;">Beta</div>
      <h1>تسجيل الدخول</h1>
      <p class="auth-sub">منصتك التعليمية الخاصة</p>

      <form id="loginForm">
        <div class="field">
          <label>رقم الهاتف</label>
          <input type="tel" id="phone" placeholder="01xxxxxxxxx" required />
        </div>
        <div class="field">
          <label>كلمة المرور</label>
          <input type="password" id="password" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn" id="loginBtn">تسجيل الدخول</button>
        <div class="msg" id="msg"></div>
      </form>

      <div class="switch-link">
        ليس لديك حساب؟ <a href="signup.html">إنشاء حساب جديد</a>
      </div>
    </div>
  </div>

  <script type="module">
    import { auth, db, doc, getDoc, updateDoc, signInWithEmailAndPassword, signOut, phoneToPseudoEmail, BACKEND_URL, serverTimestamp } from "./js/firebase-config.js";
    import { getOrCreateDeviceId, getDeviceFingerprint } from "./js/device.js";

    const form = document.getElementById("loginForm");
    const msg = document.getElementById("msg");
    const btn = document.getElementById("loginBtn");

    function showMsg(text, type) {
      msg.textContent = text;
      msg.className = "msg " + (type || "");
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      btn.disabled = true;
      showMsg("جارٍ التحقق...", "");

      const phone = document.getElementById("phone").value.trim();
      const password = document.getElementById("password").value;
      const email = phoneToPseudoEmail(phone);

      try {
        const cred = await signInWithEmailAndPassword(auth, email, password);
        const user = cred.user;
        const idToken = await user.getIdToken();

        // 1) التحقق من حالة الحساب والدور مباشرة من Firestore
        const userSnap = await getDoc(doc(db, "users", user.uid));
        if (!userSnap.exists()) {
          await signOut(auth);
          showMsg("الحساب غير موجود.", "error");
          btn.disabled = false;
          return;
        }
        const data = userSnap.data();

        if (data.status === "disabled") {
          await signOut(auth);
          showMsg("تم تعطيل هذا الحساب من الإدارة.", "error");
          btn.disabled = false;
          return;
        }
        if (data.status === "pending") {
          await signOut(auth);
          showMsg("الحساب قيد المراجعة، سيتم تفعيله من الإدارة قريبًا.", "error");
          btn.disabled = false;
          return;
        }

        // 2) التحقق من ربط الجهاز عبر الـ Backend (المصدر الموثوق الوحيد)
        const deviceId = getOrCreateDeviceId();
        const fingerprint = getDeviceFingerprint();

        const res = await fetch(`${BACKEND_URL}/api/device/verify`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${idToken}`,
          },
          body: JSON.stringify({ deviceId, fingerprint }),
        });

        const result = await res.json();

        if (!res.ok) {
          await signOut(auth);
          showMsg(result.message || "هذا الحساب مرتبط بجهاز آخر.", "error");
          btn.disabled = false;
          return;
        }

        // 3) تحديث آخر تسجيل دخول
        await updateDoc(doc(db, "users", user.uid), { lastLogin: serverTimestamp() });

        showMsg("تم تسجيل الدخول بنجاح، جارٍ التحويل...", "success");

        if (data.role === "owner" || data.role === "admin") {
          window.location.href = "dashboard.html";
        } else {
          window.location.href = "student.html";
        }
      } catch (err) {
        console.error(err);
        showMsg("رقم الهاتف أو كلمة المرور غير صحيحة.", "error");
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
